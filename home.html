<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Full Screen Image</title>
    <style>
        html,body { height:100%; margin:0; }
        img.fullscreen {
            width:100vw;
            height:100vh;
            object-fit:cover;
            display:block;
        }
    </style>
</head>
<body>
    <!-- Replace the src with your image path -->
    <img class="fullscreen" src="ttsscomputer.png" alt="Full screen image" />
</body>
</html>
